<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img" aria-label="A balance weighing benefit against risk">
<title>Safety First — weighing benefit against risk</title>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#5b9bff"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5b9bff"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5"><stop stop-color="#34d399" stop-opacity="0.4"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5"><stop stop-color="#f4736b" stop-opacity="0.38"/><stop offset="1" stop-color="#f4736b" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop stop-color="#5b9bff" stop-opacity="0.32"/><stop offset="1" stop-color="#5b9bff" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#03060d" flood-opacity="0.5"/></filter>
  
</defs><defs><symbol id="st" viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></symbol></defs>
<circle cx="120" cy="330" r="160" fill="url(#glowG)"/>
<circle cx="470" cy="290" r="135" fill="url(#glowR)"/>
<g fill="#34507f"><circle cx="70" cy="80" r="3"/><circle cx="500" cy="70" r="3"/><circle cx="300" cy="36" r="2.5"/><circle cx="516" cy="190" r="2.5"/><circle cx="56" cy="205" r="2.5"/><circle cx="150" cy="60" r="2"/></g>
<g filter="url(#sh)" transform="translate(252,22) scale(1)"><path d="M28 2 52 10V30C52 46 41 57 28 62 15 57 4 46 4 30V10Z" fill="url(#brand)"/><path d="M17 30 25 38 40 22" stroke="#06281c" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<path d="M280 118 316 360 244 360Z" fill="#1b2748" stroke="#263256" stroke-width="2"/>
<rect x="230" y="356" width="100" height="13" rx="6.5" fill="#263256"/>
<line x1="96" y1="150" x2="464" y2="118" stroke="url(#beam)" stroke-width="9" stroke-linecap="round" filter="url(#sh)"/>
<circle cx="280" cy="134" r="11" fill="#eaf0fb"/><circle cx="280" cy="134" r="5" fill="#1b2748"/>
<!-- benefit pan (left, lower = it wins) -->
<line x1="96" y1="150" x2="60" y2="252" stroke="#46598a" stroke-width="2"/><line x1="96" y1="150" x2="132" y2="252" stroke="#46598a" stroke-width="2"/>
<g filter="url(#sh)"><rect x="32" y="250" width="128" height="104" rx="16" fill="#16203a" stroke="#34d399" stroke-opacity="0.4" stroke-width="2"/></g>
<text x="96" y="278" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="0.12em">BENEFIT</text>
<use href="#st" x="52" y="290" width="16" height="16" fill="#f5b13d"/><use href="#st" x="70" y="290" width="16" height="16" fill="#f5b13d"/><use href="#st" x="88" y="290" width="16" height="16" fill="#f5b13d"/><use href="#st" x="106" y="290" width="16" height="16" fill="#f5b13d"/><use href="#st" x="124" y="290" width="16" height="16" fill="#f5b13d"/>
<text x="96" y="340" text-anchor="middle" fill="#9fb0d0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5">clearly worth it</text>
<!-- risk pan (right, higher = controlled) -->
<line x1="464" y1="118" x2="430" y2="206" stroke="#46598a" stroke-width="2"/><line x1="464" y1="118" x2="498" y2="206" stroke="#46598a" stroke-width="2"/>
<g filter="url(#sh)"><rect x="400" y="204" width="128" height="104" rx="16" fill="#16203a" stroke="#f4736b" stroke-opacity="0.4" stroke-width="2"/></g>
<text x="464" y="232" text-anchor="middle" fill="#f4736b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="0.12em">RISK</text>
<circle cx="464" cy="266" r="19" fill="#f4736b" fill-opacity="0.16" stroke="#f4736b" stroke-width="2"/>
<text x="464" y="274" text-anchor="middle" fill="#f4736b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">!</text>
</svg>
